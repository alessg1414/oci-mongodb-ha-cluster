# ==============================================================================
# MongoDB 7.0 Configuration - Node 1 (Primary Host)
# Host IP: 10.0.1.10
# Project / Cluster: rsJobBridge
# ==============================================================================

# Network Interfaces
net:
  port: 27017
  bindIp: 127.0.0.1,10.0.1.10

# Storage Engine & System Paths
storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true

# Logging Configuration
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# Process Management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
  fork: true
  pidFilePath: /var/run/mongodb/mongod.pid

# Enterprise Replica Set Settings
replication:
  replSetName: "rsJobBridge"

# Operational Diagnostics
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100