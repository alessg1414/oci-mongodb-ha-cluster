# ==============================================================================
# MongoDB 7.0 Configuration - Node 2 (Secondary Data Instance)
# Host IP: 10.0.1.11
# Service Port: 27017
# Project / Cluster: rsJobBridge
# ==============================================================================

# Network Interfaces
net:
  port: 27017
  bindIp: 127.0.0.1,10.0.1.11

# Storage Engine & System Paths
storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true

# Logging Configuration
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# Process Management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
  fork: true
  pidFilePath: /var/run/mongodb/mongod.pid

# Enterprise Replica Set Settings
replication:
  replSetName: "rsJobBridge"

# Operational Diagnostics
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100


# ==============================================================================
# MongoDB 7.0 Configuration - Node 2 (Isolated Quorum Arbiter)
# Host IP: 10.0.1.11
# Service Port: 27018
# Project / Cluster: rsJobBridge
# ==============================================================================

# Network Interfaces
net:
  port: 27018
  bindIp: 127.0.0.1,10.0.1.11

# Storage Engine (Minimal footprint for vote state, no data payload)
storage:
  dbPath: /var/lib/mongodb-arbiter
  journal:
    enabled: true

# Isolated Logging Configuration
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod-arbiter.log

# Process Management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
  fork: true
  pidFilePath: /var/run/mongodb/mongod-arbiter.pid

# Enterprise Replica Set Settings (Must match target cluster)
replication:
  replSetName: "rsJobBridge"